<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes 行为树</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2230; --muted: #6b7385; --line: #d5d9e2; --soft: #eef0f5;
    --run: #2563eb; --run-bg: #e8f0ff;
    --done: #16a34a; --done-bg: #e7f6ec;
    --fail: #dc2626; --fail-bg: #fdeaea;
    --stall: #d97706; --stall-bg: #fdf1dd;
    --rest: #64748b; --rest-bg: #eef1f6;
    --shadow: 0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b24; --ink: #e6e9f0; --muted: #8b94a8; --line: #2c3342; --soft: #1f2430;
      --run: #5b9bff; --run-bg: #14233f; --done: #4cc476; --done-bg: #12281b;
      --fail: #ff6b6b; --fail-bg: #351919; --stall: #f0a23b; --stall-bg: #35260f;
      --rest: #8d9ab3; --rest-bg: #1d2330; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b24; --ink: #e6e9f0; --muted: #8b94a8; --line: #2c3342; --soft: #1f2430;
    --run: #5b9bff; --run-bg: #14233f; --done: #4cc476; --done-bg: #12281b;
    --fail: #ff6b6b; --fail-bg: #351919; --stall: #f0a23b; --stall-bg: #35260f;
    --rest: #8d9ab3; --rest-bg: #1d2330; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 16px; display: grid; gap: 8px; }
  .row1 { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .legend, .controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); font-size: 12.5px; }
  .controls { margin-left: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; vertical-align: -1px; margin-right: 5px; }
  .dot.run { background: var(--run); animation: ping 1.6s infinite; }
  .dot.done { background: var(--done); } .dot.fail { background: var(--fail); }
  .dot.stall { background: var(--stall); } .dot.rest { background: var(--rest); }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .shape { display: inline-block; width: 22px; height: 12px; vertical-align: -2px; margin-right: 5px; border: 1.6px solid var(--muted); }
  .shape.s-status { border-radius: 99px; border-width: 2.6px; }
  .shape.s-task { border-radius: 5px; }
  .shape.s-leaf { border-radius: 2px; border-style: dashed; }
  .shape.s-root { border-radius: 6px; border-width: 2.6px; border-style: double; border-width: 4px; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  label.chk { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
  .live.bad i { background: var(--fail); }
  /* 顶部：每个 Hermes 一个状态胶囊 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; border: 1.6px solid var(--line);
    background: var(--panel); cursor: pointer; font-size: 13px; }
  .chip b { font-weight: 650; }
  .chip small { color: var(--muted); font-size: 12px; }
  .chip.busy { border-color: var(--run); background: var(--run-bg); } .chip.busy small { color: var(--run); }
  .chip.rest { border-color: var(--rest); background: var(--rest-bg); }
  .chip.offline { border-color: var(--fail); background: var(--fail-bg); } .chip.offline small { color: var(--fail); }
  main { padding: 16px; display: grid; gap: 16px; }
  section.inst { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 110px; }
  .inst-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .inst-head b { font-size: 15px; }
  .pill { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); }
  .pill.run { background: var(--run-bg); color: var(--run); } .pill.fail { background: var(--fail-bg); color: var(--fail); }
  .pill.stall { background: var(--stall-bg); color: var(--stall); } .pill.done { background: var(--done-bg); color: var(--done); }
  .scroll { overflow: auto; padding: 8px 12px 14px; }
  svg { display: block; }
  .link { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .link.run { stroke: var(--run); stroke-dasharray: 5 5; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -10; } }
  .node { cursor: pointer; }
  .node rect.box { fill: var(--panel); stroke-width: 1.6; }
  .node:hover rect.box { filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
  .node.sel rect.box { stroke-width: 3; }
  .node text { fill: var(--ink); pointer-events: none; }
  .node .t1 { font-size: 12.5px; font-weight: 600; }
  .node .t2 { font-size: 11px; fill: var(--muted); }
  .node .t3 { font-size: 10.5px; fill: var(--muted); }
  .node .chev { font-size: 13px; font-weight: 700; fill: var(--muted); }
  /* 四种节点用四种边框 */
  .t-root rect.box { stroke-width: 3.4; }                      /* 根：粗实线 */
  .t-status rect.box { stroke-width: 2.8; }                    /* 状态：胶囊 + 粗线 */
  .t-task rect.box { stroke-width: 1.6; }                      /* 任务：细实线圆角 */
  .t-leaf rect.box { stroke-width: 1.7; stroke-dasharray: 6 3.5; } /* 工人：虚线直角 */
  .leaf-ico { fill: none; }
  .oc-p { fill: var(--ink); }
  .insp { margin: 0 16px; }
  .insp .bar { display:flex; gap:8px; align-items:center; padding:8px 12px; margin-top:8px; border:1px solid var(--line);
    border-radius: 10px 10px 0 0; background: var(--panel); cursor:pointer; font-size:13px; }
  .insp .bar b { font-weight: 650; }
  .insp .bar small { color: var(--muted); }
  .insp pre { display:none; margin:0; padding:10px 14px; border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px;
    background: var(--panel); white-space: pre-wrap; word-break: break-word; font: 13px/1.65 ui-monospace, Menlo, monospace; max-height: 240px; overflow:auto; }
  .insp.open pre { display:block; }
  .insp.err .bar small { color: var(--fail); }
  .st-run rect.box { stroke: var(--run); fill: var(--run-bg); }
  .st-done rect.box { stroke: var(--done); }
  .t-status.st-done rect.box { fill: var(--done-bg); }
  .st-fail rect.box { stroke: var(--fail); fill: var(--fail-bg); }
  .st-stall rect.box { stroke: var(--stall); fill: var(--stall-bg); }
  .st-rest rect.box { stroke: var(--rest); fill: var(--rest-bg); }
  .badge-run { fill: var(--run); } .badge-done { fill: var(--done); } .badge-fail { fill: var(--fail); } .badge-stall { fill: var(--stall); } .badge-rest { fill: var(--rest); }
  .ring { fill: none; stroke: var(--run); stroke-width: 2; transform-origin: center; transform-box: fill-box; animation: spin 1.1s linear infinite; stroke-dasharray: 12 20; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .more { font-size: 12px; fill: var(--muted); cursor: pointer; }
  .more:hover { fill: var(--run); }
  .empty { color: var(--muted); padding: 22px; text-align: center; }
  aside { position: fixed; right: 0; top: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel);
    border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.15); transform: translateX(105%);
    transition: transform .18s; z-index: 10; display: flex; flex-direction: column; }
  aside.open { transform: none; }
  aside .bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  aside .body { padding: 14px 16px 30px; overflow: auto; }
  aside h3 { margin: 16px 0 5px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  aside pre { margin: 0; white-space: pre-wrap; word-break: break-word; background: var(--soft); border-radius: 8px; padding: 9px 11px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-height: 240px; overflow: auto; }
  aside .kv { display: grid; grid-template-columns: 78px 1fr; gap: 3px 10px; font-size: 13px; }
  aside .kv span:nth-child(odd) { color: var(--muted); }
  ul.steps { margin: 0; padding-left: 18px; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  @media (max-width: 640px) { header { padding: 8px 12px; } main { padding: 10px; } .controls { margin-left: 0; } }
  pre.longtext { white-space: pre-wrap; word-break: break-word; max-height: 55vh; overflow: auto;
    background: var(--soft); padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1>Hermes 行为树</h1>
    <div class="legend">
      <span><i class="dot run"></i>进行中</span><span><i class="dot done"></i>已完成</span>
      <span><i class="dot stall"></i>被中断</span><span><i class="dot fail"></i>失败/离线</span><span><i class="dot rest"></i>休息</span>
      <span style="opacity:.5">|</span>
      <span><i class="shape s-root"></i>Hermes</span><span><i class="shape s-status"></i>状态</span>
      <span><i class="shape s-task"></i>任务</span><span><i class="shape s-leaf"></i>工人（Claude / opencode / Antigravity）</span>
    </div>
    <div class="controls">
      <label>范围
        <select id="win">
          <option value="1">近 1 小时</option><option value="6">近 6 小时</option>
          <option value="24" selected>近 24 小时</option><option value="168">近 7 天</option><option value="0">全部</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="onlyRun"> 只看进行中</label>
      <button id="expandAll" title="展开/折叠所有「已完成」">展开已完成</button>
      <span class="live" id="live"><i></i><span id="liveTxt">连接中…</span></span>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="insp" id="insp"><div class="bar" id="inspBar"><b>🧭 巡检摘要</b><small id="inspMeta">等待首次巡检…</small><span style="margin-left:auto">▾</span></div><pre id="inspText"></pre></div>

<aside id="side"><div class="bar"><b id="sideTitle"></b><button id="sideClose">关闭</button></div><div class="body" id="sideBody"></div></aside>

<script>
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const ST = { running: ["run", "进行中"], done: ["done", "已完成"], failed: ["fail", "失败"], stalled: ["stall", "已中断"] };
const GROUPS = [ // 状态层：顺序即显示顺序
  { key: "running", cls: "run", title: "正在运行中" },
  { key: "stalled", cls: "stall", title: "被中断" },
  { key: "done", cls: "done", title: "已完成" },
];
const W = { root: 196, status: 168, task: 276, leaf: 376 };
const H = { root: 58, status: 50, task: 66, leaf: 104 };
const GAPX = 50, GAPY = 12, GROUPGAP = 20, PAD = 14, CAP = 12;
const state = { snap: null, recvAt: 0, sel: null, fold: {}, more: new Set(), win: 24, onlyRun: false };
try {
  state.win = +localStorage.getItem("hm.win") || 24; state.onlyRun = localStorage.getItem("hm.run") === "1";
  state.fold = JSON.parse(localStorage.getItem("hm.fold") || "{}");
} catch (e) {}
$("#win").value = String(state.win); $("#onlyRun").checked = state.onlyRun;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fit = (s, n) => { s = String(s || ""); let w = 0, o = ""; for (const ch of s) { w += ch.charCodeAt(0) > 255 ? 2 : 1; if (w > n) return o + "…"; o += ch; } return o; };
const dur = s => { s = Math.max(0, Math.round(s)); if (s < 60) return s + "秒"; if (s < 3600) return Math.floor(s / 60) + "分" + String(s % 60).padStart(2, "0") + "秒"; if (s < 86400) return Math.floor(s / 3600) + "时" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "分"; return Math.floor(s / 86400) + "天" + Math.floor(s % 86400 / 3600) + "时"; };
const p2 = n => String(n).padStart(2, "0");
const clock = ts => { if (!ts) return "—"; const d = new Date(ts * 1000), t = new Date(); const hm = `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; return d.toDateString() === t.toDateString() ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`; };
const full = ts => ts ? new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false }) : "—";
const nowTs = () => state.snap ? state.snap.ts + (Date.now() - state.recvAt) / 1000 : Date.now() / 1000;

function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

// 折叠：默认「已完成」折叠，其余展开；用户点过之后记住
const foldKey = (inst, g) => inst.id + ":" + g;
const isFolded = (inst, g) => { const v = state.fold[foldKey(inst, g)]; return v === undefined ? g === "done" : v; };
function setFold(inst, g, v) { state.fold[foldKey(inst, g)] = v; try { localStorage.setItem("hm.fold", JSON.stringify(state.fold)); } catch (_) {} }

// 时间描述：三种状态各自展示该展示的时间
function timeLine(n, now) {
  const st = n.status;
  if (st === "running") return `启动 ${clock(n.startedAt)} · 已运行 ${dur(now - n.startedAt)}`;
  if (st === "done") { const e = n.endedAt || n.lastTs || n.startedAt; return `完成 ${clock(e)} · ${dur(now - e)}前`; }
  if (st === "failed") { const e = n.endedAt || n.startedAt; return `失败 ${clock(e)} · ${dur(now - e)}前`; }
  const e = n.lastActivity || n.lastTs || n.endedAt || n.startedAt; return `中断 ${clock(e)} · ${dur(now - e)}前（启动 ${clock(n.startedAt)}）`;
}

const HARN = { claude: "Claude", opencode: "opencode", antigravity: "Antigravity", subagent: "子代理", process: "进程" };
const STC = { run: "#2563eb", done: "#16a34a", fail: "#dc2626", stall: "#d97706", rest: "#64748b" };

function iconMark(g, name, s, cls) {
  const c = STC[cls] || STC.rest, m = s / 2, running = cls === "run";
  const ring = () => { if (!running) return; const r = m + 4.5, C = 2 * Math.PI * r;
    el("circle", { class: "ring", cx: m, cy: m, r, "stroke-dasharray": `${(C * .3).toFixed(1)} ${C.toFixed(1)}` }, g); };
  const frame = () => { el("rect", { x: -2.5, y: -2.5, width: s + 5, height: s + 5, rx: 12,
    fill: "none", stroke: running ? "var(--line)" : c, "stroke-width": 2.4 }, g); ring(); };
  if (name === "opencode") { frame(); el("use", { href: "#ico-oc", width: s, height: s }, g); return; }
  if (name === "antigravity") { frame(); el("use", { href: "#ico-ag", width: s, height: s }, g); return; }
  if (name === "subagent") {
    el("rect", { x: 0, y: 0, width: s, height: s, rx: 11, fill: "var(--panel)", stroke: running ? "var(--line)" : c, "stroke-width": 2.2 }, g); ring();
    const t = el("text", { x: m, y: m + s * .16, fill: "#9775fa", "text-anchor": "middle", "font-size": s * .60 }, g);
    t.textContent = "◈";
  } else if (name === "claude") {
    el("rect", { x: 0, y: 0, width: s, height: s, rx: 11, fill: "var(--panel)", stroke: running ? "var(--line)" : c, "stroke-width": 2.2 }, g);
    ring();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 - Math.PI / 2;
      el("line", { x1: m + Math.cos(a) * s * .10, y1: m + Math.sin(a) * s * .10,
        x2: m + Math.cos(a) * s * .34, y2: m + Math.sin(a) * s * .34,
        stroke: "#D97757", "stroke-width": Math.max(1.6, s * .075), "stroke-linecap": "round" }, g);
    }
  } else {
    el("rect", { x: 0, y: 0, width: s, height: s, rx: 11, fill: "var(--panel)", stroke: running ? "var(--line)" : c, "stroke-width": 2.2 }, g);
    ring();
    const t = el("text", { x: m, y: m + s * .12, fill: "var(--muted)", "text-anchor": "middle", "font-size": s * .40 }, g);
    t.textContent = "›_";
  }
}

function wrapRest(text, n) {
  const t = String(text || "");
  if (t.length <= n) return "";
  return t.slice(n);
}

function nodeBox(parent, o) {
  const { x, y, w, h, type, cls, lines, onClick, sel, chev, icon } = o;
  const g = el("g", { class: `node t-${type} st-${cls} ${sel ? "sel" : ""}`, transform: `translate(${x},${y})` }, parent);
  el("rect", { class: "box", width: w, height: h, rx: type === "status" ? h / 2 : type === "leaf" ? 3 : type === "root" ? 14 : 10 }, g);
  let bx;
  if (type === "leaf" && icon) {
    iconMark(el("g", { transform: `translate(14,${(h - 44) / 2})` }, g), icon, 44, cls);
    bx = 56;
  } else {
    bx = type === "status" ? 20 : 17;
    if (cls === "run") el("circle", { class: "ring", cx: bx, cy: h / 2, r: 7.5 }, g);
    el("circle", { class: `badge-${cls}`, cx: bx, cy: h / 2, r: 4.6 }, g);
  }
  const n = lines.length, step = n >= 4 ? 17 : (n === 3 ? (type === "leaf" ? 19 : 16) : 17),
    y0 = h / 2 - ((n - 1) * step) / 2 + 4;
  lines.forEach((t, i) => { const tx = el("text", { class: ["t1", "t2", "t3"][i], x: bx + 14, y: y0 + i * step }, g); tx.textContent = t; });
  if (chev) { const c = el("text", { class: "chev", x: w - 24, y: h / 2 + 5 }, g); c.textContent = chev; }
  g.addEventListener("click", ev => { ev.stopPropagation(); onClick(); });
  return g;
}

function visibleTasks(inst, now) {
  let tasks = inst.tasks.filter(t => state.win === 0 || now - (t.lastTs || t.startedAt) <= state.win * 3600 || t.status === "running");
  if (state.onlyRun) tasks = tasks.filter(t => t.status === "running" || t.leaves.some(l => l.status === "running"));
  return tasks;
}

function renderInstance(inst, now) {
  const sec = document.createElement("section"); sec.className = "inst"; sec.id = "inst-" + inst.id;
  const tasks = visibleTasks(inst, now);
  const byStatus = { running: [], stalled: [], done: [] };
  tasks.forEach(t => (byStatus[t.status] || byStatus.stalled).push(t));
  const allLeaves = tasks.flatMap(t => t.leaves);
  const nLeafRun = allLeaves.filter(l => l.status === "running").length;
  const head = document.createElement("div"); head.className = "inst-head";
  head.innerHTML = `<b>${esc(inst.name)}</b><span class="pill ${inst.alive ? "done" : "fail"}">${inst.alive ? "gateway 在线" : "gateway 离线"}</span>
    <span class="pill ${byStatus.running.length ? "run" : ""}">${byStatus.running.length} 个任务进行中</span>
    <span class="pill ${nLeafRun ? "run" : ""}">${nLeafRun}/${allLeaves.length} 个工人在跑</span>
    <span class="pill">${esc(inst.home.split("/").slice(-1)[0])}</span>${inst.error ? `<span class="pill fail">${esc(inst.error)}</span>` : ""}`;
  sec.appendChild(head);
  const sc = document.createElement("div"); sc.className = "scroll"; sec.appendChild(sc);

  const colX = [PAD]; colX.push(colX[0] + W.root + GAPX); colX.push(colX[1] + W.status + GAPX); colX.push(colX[2] + W.task + GAPX);
  // ---- 布局 ----
  let y = PAD; const groups = [];
  GROUPS.forEach(gd => {
    const list = byStatus[gd.key]; if (!list.length) return;
    const folded = isFolded(inst, gd.key), mk = foldKey(inst, gd.key);
    const shown = folded ? [] : (state.more.has(mk) ? list : list.slice(0, CAP));
    const rows = []; let gy = y;
    shown.forEach(t => {
      const lh = t.leaves.length * (H.leaf + GAPY) - GAPY;
      const rowH = Math.max(H.task, lh);
      rows.push({ t, y: gy, h: rowH, ty: gy + (rowH - H.task) / 2, ly: t.leaves.map((_, i) => gy + (rowH - lh) / 2 + i * (H.leaf + GAPY)) });
      gy += rowH + GAPY;
    });
    let extra = 0;
    if (!folded && list.length > shown.length) { extra = 22; gy += extra; }
    const gh = Math.max(rows.length ? gy - y - GAPY - extra + (extra ? 0 : 0) : 0, H.status);
    const top = y, mid = rows.length ? (rows[0].ty + H.task / 2 + rows[rows.length - 1].ty + H.task / 2) / 2 : top + H.status / 2;
    groups.push({ gd, list, folded, rows, mk, sy: mid - H.status / 2, moreY: gy - extra + 4, hidden: list.length - shown.length });
    y = Math.max(gy, top + H.status + GAPY) + GROUPGAP - GAPY;
  });
  const totalH = Math.max(y - GROUPGAP + GAPY + PAD, H.root + PAD * 2);
  const svgW = colX[3] + W.leaf + PAD;
  const svg = el("svg", { width: svgW, height: totalH, viewBox: `0 0 ${svgW} ${totalH}` });
  const linkG = el("g", {}, svg), nodeG = el("g", {}, svg);
  const curve = (x1, y1, x2, y2, run) => { const mx = (x1 + x2) / 2; el("path", { class: "link" + (run ? " run" : ""), d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}` }, linkG); };
  const rootY = groups.length ? (groups[0].sy + groups[groups.length - 1].sy + H.status) / 2 - H.root / 2 : PAD;

  groups.forEach(G => {
    curve(colX[0] + W.root, rootY + H.root / 2, colX[1], G.sy + H.status / 2, G.gd.key === "running");
    G.rows.forEach(r => {
      curve(colX[1] + W.status, G.sy + H.status / 2, colX[2], r.ty + H.task / 2, r.t.status === "running");
      r.t.leaves.forEach((l, i) => curve(colX[2] + W.task, r.ty + H.task / 2, colX[3], r.ly[i] + H.leaf / 2, l.status === "running"));
    });
  });

  // 根
  const busy = inst.state === "busy", offline = inst.state === "offline";
  const rootCls = offline ? "fail" : busy ? "run" : "rest";
  const rootLine = offline ? "离线" : busy ? `忙碌 · 已忙 ${dur(now - (inst.busy_since || now))}` : (inst.rest_since ? `休息 · 已休息 ${dur(now - inst.rest_since)}` : "休息 · 暂无记录");
  nodeBox(nodeG, { x: colX[0], y: rootY, w: W.root, h: H.root, type: "root", cls: rootCls, sel: state.sel === "root:" + inst.id,
    lines: [fit(inst.name, 26), fit(rootLine, 28)], onClick: () => { state.sel = "root:" + inst.id; openSide({ ...inst, _kind: "root" }, "root", now); render(); } });

  // 状态层 + 任务 + 叶子
  groups.forEach(G => {
    const nRun = G.list.reduce((a, t) => a + t.leaves.filter(l => l.status === "running").length, 0);
    const sub = G.gd.key === "running" && nRun ? `${G.list.length} 个任务 · ${nRun} 个工人在跑` : `${G.list.length} 个任务`;
    nodeBox(nodeG, { x: colX[1], y: G.sy, w: W.status, h: H.status, type: "status", cls: G.gd.cls, chev: G.folded ? "▸" : "▾",
      lines: [G.gd.title, sub], onClick: () => { setFold(inst, G.gd.key, !G.folded); render(); } });
    G.rows.forEach(r => {
      const t = r.t, nl = t.leaves.length;
      const l3 = ((t.note && t.status === "running" ? "📡 " + t.note + " · " : "") + `${t.chat ? fit(t.chat, 16) : ""}${nl ? ` · ${nl} 个工人` : ""}${t.status === "done" && t.endedAt ? " · 用时 " + dur(t.endedAt - t.startedAt) : ""}`).replace(/^ · /, "");
      nodeBox(nodeG, { x: colX[2], y: r.ty, w: W.task, h: H.task, type: "task", cls: ST[t.status] ? ST[t.status][0] : "stall", sel: state.sel === t.id,
        lines: [fit((t.reported ? "📡 " : "") + (t.title || "（空）"), 38), fit(timeLine(t, now), 46), fit(l3 || " ", 46)],
        onClick: () => { state.sel = t.id; openSide(t, "task", now); render(); } });
      t.leaves.forEach((l, i) => {
        const h = l.harness || l.kind || "claude";
        const hn = HARN[h] || h;
        const brief = l.brief || l.expect || (l.plan && l.plan.what) || (l.doing && l.doing.now) || "（未解析到任务简介）";
        const runFor = l.status === "running" ? dur(now - (l.startedAt || now))
          : l.endedAt ? "用时 " + dur(l.endedAt - l.startedAt) : dur(now - (l.startedAt || now));
        const when = l.startedAt ? new Date(l.startedAt * 1000).toLocaleString("zh-CN",
          { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }) : "—";
        const line3 = `[${hn}] ${l.model || "默认"} · ${l.turns || 1} 轮 · ${when} 启动 · ${runFor}`;
        nodeBox(nodeG, { x: colX[3], y: r.ly[i], w: W.leaf, h: H.leaf, type: "leaf", icon: h,
          cls: ST[l.status] ? ST[l.status][0] : "stall", sel: state.sel === l.id,
          lines: [fit((l.reported ? "📡 " : "") + (l.title || "（工人）"), 46),
                  fit(brief, 48), fit(wrapRest(brief, 48), 48), fit(line3, 54)],
          onClick: () => { state.sel = l.id; openSide(l, "leaf", now); render(); } });
      });
    });
    if (!G.folded && G.hidden > 0) {
      const m = el("text", { class: "more", x: colX[2], y: G.moreY + 14 }, nodeG); m.textContent = `▾ 还有 ${G.hidden} 个更早的「${G.gd.title}」任务，点击展开`;
      m.addEventListener("click", () => { state.more.add(G.mk); render(); });
    }
  });
  sc.appendChild(svg);
  if (!groups.length) { const n = document.createElement("div"); n.className = "empty"; n.style.padding = "0 16px 14px"; n.textContent = state.onlyRun ? "当前没有进行中的任务。" : "这段时间内没有任务，只有一个空的根节点。"; sc.appendChild(n); }
  return sec;
}

function render() {
  const snap = state.snap; if (!snap) return;
  const now = nowTs();
  const main = $("#main");
  const wx = window.scrollX, wy = window.scrollY;
  const keep = [...main.querySelectorAll(".scroll")].map(s => [s.scrollLeft, s.scrollTop]);
  const frag = document.createDocumentFragment();
  if (!snap.instances.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "没发现 Hermes 实例。"; frag.appendChild(d); }
  snap.instances.forEach(inst => frag.appendChild(renderInstance(inst, now)));
  main.style.minHeight = main.offsetHeight + "px";
  main.replaceChildren(frag);
  main.querySelectorAll(".scroll").forEach((sc, i) => { if (keep[i]) { sc.scrollLeft = keep[i][0]; sc.scrollTop = keep[i][1]; } });
  window.scrollTo(wx, wy);
  main.style.minHeight = "";
  window.scrollTo(wx, wy);
  renderChips();
}

// 顶部：每个 Hermes 忙/闲 + 持续时间（每秒走字）
function renderChips() {
  const snap = state.snap; if (!snap) return;
  const now = nowTs(), box = $("#chips");
  const html = snap.instances.map(i => {
    const busy = i.state === "busy", off = i.state === "offline";
    const cls = off ? "offline" : busy ? "busy" : "rest";
    const txt = off ? "离线" : busy ? `忙碌 · 已忙 ${dur(now - (i.busy_since || now))}` : (i.rest_since ? `休息 · 已休息 ${dur(now - i.rest_since)}` : "休息");
    const dot = off ? "fail" : busy ? "run" : "rest";
    return `<span class="chip ${cls}" data-id="${esc(i.id)}"><i class="dot ${dot}" style="margin:0"></i><b>${esc(i.name)}</b><small>${esc(txt)}</small></span>`;
  }).join("");
  if (box.dataset.h !== html) { box.innerHTML = html; box.dataset.h = html; }
}
$("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; const s = document.getElementById("inst-" + c.dataset.id); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); });
setInterval(renderChips, 1000);

function renderInsp(ins, stats) {
  if (!ins) return;
  const box = $("#insp"), pre = $("#inspText"), meta = $("#inspMeta");
  if (ins.text && pre.dataset.t !== String(ins.ts)) { pre.textContent = ins.text; pre.dataset.t = ins.ts; }
  const when = ins.ts ? new Date(ins.ts * 1000).toLocaleTimeString("zh-CN", { hour12: false }) : "";
  const cost = stats && stats.calls !== undefined
    ? ` · 巡检 LLM ${stats.calls} 次 / 跳过 ${stats.skipped} 次`
      + (stats.title_calls !== undefined ? `；标题 LLM ${stats.title_calls} 次 / 跳过 ${stats.title_skipped} 次` : "")
      + "（均只在新节点/树变化时调用）" : "";
  meta.textContent = (ins.error ? "巡检失败：" + ins.error : (when ? `更新于 ${when} · ${ins.model || ""}` : "等待首次巡检…")) + cost;
  box.classList.toggle("err", !!ins.error);
}
$("#inspBar").onclick = () => {
  const open = $("#insp").classList.toggle("open");
  try { localStorage.setItem("hm.insp", open ? "1" : "0"); } catch (_) {}
  $("#inspBar").lastElementChild.textContent = open ? "▾" : "▸";
};
try { if (localStorage.getItem("hm.insp") !== "0") $("#insp").classList.add("open"); } catch (_) {}

function openSide(n, kind, now) {
  const stk = kind === "root" ? (n.state === "busy" ? "running" : n.state === "offline" ? "failed" : "rest") : n.status;
  const [cls, label] = kind === "root" ? [n.state === "busy" ? "run" : n.state === "offline" ? "fail" : "rest", n.state === "busy" ? "忙碌" : n.state === "offline" ? "离线" : "休息"] : (ST[stk] || ST.stalled);
  const hname = kind === "leaf" ? (HARN[n.harness || n.kind] || n.harness || n.kind || "工人") : "";
  $("#sideTitle").innerHTML = `<i class="dot ${cls}"></i>${kind === "leaf" ? "工人 · " + esc(hname) : kind === "task" ? "任务" : "Hermes"} · ${label}`;
  let h = "";
  if (kind === "task") {
    h += `<div class="kv"><span>会话</span><span>${esc(n.chat)} (${esc(n.chatType || n.source)})</span><span>启动</span><span>${full(n.startedAt)}</span><span>${n.status === "running" ? "已运行" : "结束"}</span><span>${n.status === "running" ? dur(now - n.startedAt) : full(n.endedAt || n.lastTs)}</span><span>工具调用</span><span>${n.toolCalls} 次</span><span>工人</span><span>${n.leaves.length} 个</span>${n.titleSource === "llm" ? "<span>标题</span><span>AI 摘要</span>" : ""}${n.note ? `<span>进展</span><span>${esc(n.note)}</span>` : ""}${n.reported ? "<span>来源</span><span>Hermes 主动上报</span>" : ""}${n.followups ? `<span>追加指令</span><span>${n.followups} 条</span>` : ""}</div>
      ${n.outcome ? `<h3>任务完成结果（AI 总结）</h3><pre class="longtext">${esc(n.outcome)}</pre>` : ""}
      <h3>用户请求原文</h3><pre>${esc(n.text || n.rawTitle || n.title)}</pre>${n.final ? `<h3>Hermes 最终回复</h3><pre>${esc(n.final)}</pre>` : ""}`;
  } else if (kind === "leaf") {
    h += `<div class="kv"><span>工人</span><span>${esc(HARN[n.harness || n.kind] || n.harness || n.kind || "Claude")}${n.model ? " · " + esc(n.model) : ""}</span><span>模式</span><span>${esc(n.mode)}</span><span>目录</span><span>${esc(n.cwd || "—")}</span><span>启动</span><span>${full(n.startedAt)}</span><span>${n.status === "running" ? "已运行" : "结束"}</span><span>${n.status === "running" ? dur(now - n.startedAt) : full(n.endedAt)}</span>${n.pid ? `<span>PID</span><span>${n.pid}（进程存活）</span>` : ""}${n.lastActivity ? `<span>最近动静</span><span>${dur(now - n.lastActivity)}前</span>` : ""}${n.tokens ? `<span>tokens</span><span>${n.tokens}</span>` : ""}</div>`;
    if (n.aiNote && n.plan) {
      const P = n.plan;
      h += `<h3>AI 解析（基于初始派活 prompt）</h3><div class="kv">
        <span>任务</span><span>${esc(P.title || n.title)}</span>
        <span>上下文</span><span>${esc(P.context || "—")}</span>
        <span>要做什么</span><span>${esc(P.what || "—")}</span>
        <span>大概怎么做</span><span>${esc(P.how || "—")}</span>
        <span>期望结果</span><span>${esc(P.result || "—")}</span>
        <span>验收标准</span><span>${esc(P.expect || n.expect || "—")}</span></div>`;
    } else if (n.aiNote) {
      h += `<h3>AI 概览</h3><div class="kv"><span>任务</span><span>${esc(n.title)}</span><span>期望产出</span><span>${esc(n.expect || "—")}</span></div>`;
    } else {
      h += `<h3>AI 解析</h3><p style="color:var(--muted)">后台 Agent 正在解析这个工人任务的初始 prompt…</p>`;
    }
    if (n.prompt) h += `<h3>派活指令（原文，完整）</h3><pre class="longtext">${esc(n.prompt)}</pre>`;
    if (n.command && n.command !== n.prompt) h += `<h3>执行命令</h3><pre class="longtext">${esc(n.command)}</pre>`;
    if (n.doing) h += `<h3>${n.status === "running" ? "此刻在做" : "最后做的事"}</h3><ul class="steps">${n.doing.recent.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
    if (n.outcome) h += `<h3>完成结果（AI 依据 summary/产出总结）</h3><pre class="longtext">${esc(n.outcome)}</pre>`;
    if (n.result) h += `<h3>返回结果（原文）</h3><pre class="longtext">${esc(n.result)}</pre>`;
    if (n.error) h += `<h3>错误</h3><pre>${esc(n.error)}</pre>`;
  } else {
    h += `<div class="kv"><span>应用名</span><span>${esc(n.name)}</span><span>目录</span><span>${esc(n.home)}</span><span>gateway</span><span>${n.alive ? "在线 (PID " + n.pid + ")" : "离线"}</span><span>${n.state === "busy" ? "已忙" : "已休息"}</span><span>${n.state === "busy" ? dur(now - n.busy_since) : n.rest_since ? dur(now - n.rest_since) + "（最近活动 " + full(n.rest_since) + "）" : "—"}</span></div>
      <p style="color:var(--muted)">根节点 = 一个 Hermes（飞书应用）。下一层是任务状态（正在运行中 / 被中断 / 已完成，可点击折叠），再往下是对话任务，叶子是被派出去的工人（Claude Code / opencode / Antigravity）。</p>`;
  }
  const sb = $("#sideBody"), st = sb.scrollTop;
  sb.innerHTML = h; $("#side").classList.add("open"); sb.scrollTop = st;
}
$("#sideClose").onclick = () => { $("#side").classList.remove("open"); state.sel = null; render(); };
document.addEventListener("click", e => { if (!e.target.closest("aside") && !e.target.closest(".node")) $("#side").classList.remove("open"); });
$("#win").onchange = e => { state.win = +e.target.value; try { localStorage.setItem("hm.win", state.win); } catch (_) {} render(); };
$("#onlyRun").onchange = e => { state.onlyRun = e.target.checked; try { localStorage.setItem("hm.run", state.onlyRun ? "1" : "0"); } catch (_) {} render(); };
$("#expandAll").onclick = () => {
  if (!state.snap) return;
  const anyFolded = state.snap.instances.some(i => isFolded(i, "done"));
  state.snap.instances.forEach(i => setFold(i, "done", !anyFolded));
  $("#expandAll").textContent = anyFolded ? "折叠已完成" : "展开已完成"; render();
};

let fails = 0;
async function poll() {
  try {
    const r = await fetch("api/snapshot", { cache: "no-store" });
    state.snap = await r.json(); state.recvAt = Date.now(); fails = 0;
    const age = Date.now() / 1000 - state.snap.ts;
    $("#live").className = "live" + (age > 15 ? " bad" : ""); $("#liveTxt").textContent = age > 15 ? `数据已 ${Math.round(age)} 秒没更新` : "实时 · " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
    if (state.sel && $("#side").classList.contains("open")) {
      const now = nowTs();
      for (const i of state.snap.instances) {
        if ("root:" + i.id === state.sel) openSide({ ...i }, "root", now);
        for (const t of i.tasks) { if (t.id === state.sel) openSide(t, "task", now); for (const l of t.leaves) if (l.id === state.sel) openSide(l, "leaf", now); }
      }
    }
    renderInsp(state.snap.inspect, state.snap.stats);
    render();
  } catch (e) { fails++; $("#live").className = "live bad"; $("#liveTxt").textContent = "连接失败，重试中…"; }
  setTimeout(poll, fails > 3 ? 6000 : 3000);
}
poll();
</script>
</body>
</html>
